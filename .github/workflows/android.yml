name: Android Release CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized arm64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Android project files
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Create temporary CI release signing key
        shell: bash
        run: |
          STORE_PASSWORD="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair -noprompt -v \
            -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
            -storepass "$STORE_PASSWORD" -alias upload -keypass "$STORE_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LocalAI CI,O=LocalAI,C=BR"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build Release APK
        run: ./gradlew --no-daemon --parallel --max-workers=2 assembleRelease
      - name: Report APK size
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          SIZE="$(stat -c '%s' "$APK")"
          echo "Release APK: $APK"
          echo "Size: $(numfmt --to=iec-i --suffix=B "$SIZE") ($SIZE bytes)"
          if [ "$SIZE" -gt 31457280 ]; then
            echo "::warning::Release APK is above the 30 MiB target."
          fi
      - name: Upload optimized Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalAI-release-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
