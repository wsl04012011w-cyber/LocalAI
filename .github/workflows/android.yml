name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${ github.ref }
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Android project files
        shell: bash
        run: |
          missing=0
          for file in settings.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required Android project file is missing."
              missing=1
            fi
          done

          if [ ! -f gradlew ] && [ ! -f build.gradle.kts ] && [ ! -f build.gradle ]; then
            echo "::error::No Gradle wrapper or root build.gradle(.kts) found. Import the complete Android Studio/AI Studio project."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "The repository currently contains source files only. Add the complete Android project configuration, then push again."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: ${ !hashFiles('gradlew') }
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Make Gradle wrapper executable
        if: ${ hashFiles('gradlew') != '' }
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
