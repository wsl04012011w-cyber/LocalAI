name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - "llamalocal-integrado-llamacpp.zip"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found on the GitHub runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "ndk;27.0.12077973"

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q "llamalocal-integrado-llamacpp.zip" -d project
          echo "ZIP extracted."
          find project -maxdepth 5 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print

      - name: Locate Gradle project and wrapper
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS" ]]; then
            echo "::error::The ZIP does not contain settings.gradle or settings.gradle.kts. Upload the full Android/Gradle project."
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          if [[ ! -f "$ROOT/gradlew" ]]; then
            echo "::error::Gradle project found at $ROOT but gradlew is missing from the ZIP."
            exit 1
          fi
          chmod +x "$ROOT/gradlew"
          echo "ANDROID_PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Found Android project: $ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalAI-debug-apk
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
