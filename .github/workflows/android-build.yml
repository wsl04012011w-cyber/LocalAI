name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - "llamalocal-integrado-llamacpp.zip"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q "llamalocal-integrado-llamacpp.zip" -d project
          echo "ZIP extracted. Initial file listing:"
          find project -maxdepth 4 -type f | sort | head -n 160
          echo "Gradle build files:"
          find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'libs.versions.toml' -o -name 'gradle-wrapper.properties' \) -print

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS" ]]; then
            echo "::error::The ZIP does not contain settings.gradle or settings.gradle.kts. Upload the full Android/Gradle project."
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          echo "ANDROID_PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          if [[ -f "$ROOT/gradlew" ]]; then
            chmod +x "$ROOT/gradlew"
            echo "HAS_GRADLE_WRAPPER=true" >> "$GITHUB_ENV"
            echo "Found Gradle wrapper in $ROOT"
          else
            echo "HAS_GRADLE_WRAPPER=false" >> "$GITHUB_ENV"
            echo "::warning::gradlew is missing; the build will use the installed Gradle CLI."
          fi
          echo "Found Android project: $ROOT"
          echo "Root build files:"
          for file in "$ROOT"/build.gradle "$ROOT"/build.gradle.kts "$ROOT"/gradle/libs.versions.toml; do
            if [[ -f "$file" ]]; then
              echo "----- $file -----"
              sed -n '1,220p' "$file"
            fi
          done

      - name: Print Kotlin compile target for diagnosis
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$ANDROID_PROJECT_DIR/app/src/main/java/com/example/data/LocalModelStorageManager.kt"
          if [[ -f "$TARGET" ]]; then
            echo "----- $TARGET -----"
            nl -ba "$TARGET" | sed -n '1,260p'
          else
            echo "::warning::Expected Kotlin source file not found; searching project."
            find "$ANDROID_PROJECT_DIR" -name 'LocalModelStorageManager.kt' -print
          fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found on the GitHub runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          if [[ "$HAS_GRADLE_WRAPPER" == "true" ]]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalAI-debug-apk
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
